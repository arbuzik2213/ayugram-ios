name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch TDLib
        run: ./scripts/fetch_tdlib.sh

      - name: Build (unsigned)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --dart-define=TG_API_ID="$TG_API_ID" \
            --dart-define=TG_API_HASH="$TG_API_HASH"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr AyuGram-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AyuGram-ipa
          path: AyuGram-unsigned.ipa
